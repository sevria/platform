name: Deploy frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-docker-image.yaml
    secrets: inherit
    with:
      template: frontend

  run:
    uses: ./.github/workflows/run-container.yaml
    needs:
      - build
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
